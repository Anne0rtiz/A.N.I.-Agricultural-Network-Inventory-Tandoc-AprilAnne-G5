{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<section class="container narrow center">
  <div class="card">
    <h1 class="big-code">403</h1>
    <h2>You don't have access to this page</h2>
    <p>This page belongs to a different user role.</p>
    {% if user.is_authenticated %}
      <a class="btn btn-primary" href="{% url 'accounts:dashboard' %}">Go to my dashboard</a>
    {% else %}
      <a class="btn btn-primary" href="{% url 'accounts:login' %}">Log in</a>
    {% endif %}
  </div>
</section>
{% endblock %}
